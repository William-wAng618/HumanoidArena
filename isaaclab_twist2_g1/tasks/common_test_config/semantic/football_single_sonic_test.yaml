name: football_single_sonic_test
description: Test-only SONIC eval config for Isaac-Move-Football-Single-G129-Dex3-Wholebody.
task_name: Isaac-Move-Football-Single-G129-Dex3-Wholebody
backend: sonic

test_defaults:
  seeds: [0, 1, 2]
  repeats_per_seed: 20
  persistent_sim: true
  episode_seed_formula: sha256(task_name|group_seed|repeat_idx)_positive_int32

overrides:
  # Pure semantic-football-test baseline: disable the optional ipark
  # real-scene Gaussian background (5.1 hangs with gauss rendering on this box;
  # keep the pure football single scene as the benchmark).
  scene.room: null
  scene.goal_net.spawn.usd_path: "${PROJECT_ROOT}/assets/objects/small_warehouse/football_scene/interaction_obj/football_goal/football_goal_physics_semantic.usd"
  # Activate the scene-level dynamic semantic basketball: move it to its air
  # spawn point (goal origin (-2.5, 3.0, 0.65) + BASKETBALL_LOCAL_OFFSET) and
  # re-enable gravity so it falls & interacts like a normal rigid body.
  scene.semantic_basketball.init_state.pos: [-0.03698494206654779, 0.49620825073582786, 0.9291186808994101]
  scene.semantic_basketball.spawn.rigid_props.disable_gravity: false
  wait_for_textures: false
  sim:
    dt: 0.005
  decimation: 4
  object_reset_seed_source: env_seed
  deterministic_object_resets:
    - record_name: football
      scene_keys: [object, football]
      pose_range:
        x: [-1.2, 1.2]
        y: [-1.2, 1.2]
      zero_velocity_on_reset: true
